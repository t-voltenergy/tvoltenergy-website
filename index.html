<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Volt Power & Energy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
scroll-behavior:smooth;
}

body{
background:#0a0f1c;
color:white;
}

/* HEADER */
header{
position:fixed;
width:100%;
top:0;
background:rgba(0,0,0,0.7);
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
backdrop-filter:blur(8px);
}

header img{
height:70px;
}

nav a{
color:white;
margin-left:25px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

nav a:hover{
color:#fca311;
}

/* HERO SECTION */
.hero{
height:100vh;
background:url('background.jpg') no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.hero::after{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
}

.hero-content{
position:relative;
z-index:1;
animation:fadeIn 2s ease-in-out;
}

.hero-content img{
width:350px;
animation:float 4s ease-in-out infinite;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0px);}
}

/* SECTION */
section{
padding:100px 10%;
}

.section-title{
text-align:center;
margin-bottom:50px;
font-size:32px;
color:#fca311;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:#111827;
padding:30px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.4);
text-align:center;
transition:0.4s;
}

.card:hover{
transform:translateY(-12px);
background:#1f2937;
}

/* FOOTER */
footer{
background:#000814;
text-align:center;
padding:20px;
color:#aaa;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 18px;
border-radius:50%;
text-decoration:none;
font-size:22px;
box-shadow:0 0 20px #25D366;
}
</style>
</head>

<body>

<header>
<img src="logo.png">
<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</nav>
</header>

<div class="hero">
<div class="hero-content">
<img src="logo.png">
</div>
</div>

<section id="services">
<h2 class="section-title">Our Services</h2>
<div class="services">
<div class="card"><h3>Solar Installation</h3></div>
<div class="card"><h3>Industrial Wiring</h3></div>
<div class="card"><h3>Generator Setup</h3></div>
<div class="card"><h3>Maintenance</h3></div>
</div>
</section>

<section id="contact">
<h2 class="section-title">Contact Us</h2>
<p style="text-align:center;">
📞 01642824385 <br><br>
📧 tanem.jashore@gmail.com <br><br>
📍 Jashore, Bangladesh
</p>
</section>

<footer>
<p>© 2026 T-Volt Power & Energy | All Rights Reserved</p>
</footer>

<a class="whatsapp" href="https://wa.me/8801642824385" target="_blank">💬</a>

</body>
</html>
